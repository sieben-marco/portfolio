<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARCO SIEBEN</title>

    <meta
      name="description"
      content="Portfólio de Marco Sieben - Desenvolvedor Front-end"
    />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <button
          type="button"
          aria-controls="menu-navigation"
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          <!-- Ícone para abrir o menu -->
          <svg
            class="icon-open"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M3.5 8.5H20.5" />
            <path d="M3.5 15.5H20.5" />
          </svg>

          <!-- Ícone para fechar o menu -->
          <svg
            class="icon-close"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M6 6L18.0208 18.0208" />
            <path d="M6 18.0208L18.0208 6" />
          </svg>
        </button>

        <nav id="menu-navigation" aria-label="Menu de navegação">
          <ul>
            <li><a href="#about">Sobre</a></li>
            <li><a href="#skills">Habilidades</a></li>
            <li><a href="#projects">Projetos</a></li>
            <li><a href="#contact">Contato</a></li>
          </ul>
        </nav>

        <a href="#" class="logo">MARCO SIEBEN</a>
      </div>
    </header>
  </body>
</html>
